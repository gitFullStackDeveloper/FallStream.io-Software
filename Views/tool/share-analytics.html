<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Share Analytics | FallStream.io</title>
    <script src="../js/page-loader.js"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <script src="../js/dashboard.js"></script>
    <link rel="stylesheet" href="../css/share-analytics.css" />
  </head>
  <body>
    <div id="sidebar-container"></div>

    <div class="main-content" id="mainContent">
      <!-- ═══ DASHBOARD HEADER ═══ -->
      <header class="dashboard-header">
        <div class="header-left">
          <h1 class="page-title">Share Analytics</h1>
          <p class="welcome-msg">Track your shared video performance</p>
        </div>
        <div class="header-right">
          <div class="profile-dropdown" id="profileDropdown">
            <div class="avatar">
              <img
                id="headerAvatar"
                src="https://ui-avatars.com/api/?background=2563eb&color=fff&name=User"
                alt="avatar"
              />
            </div>
            <span class="profile-name" id="headerName">User</span>
            <i
              class="fas fa-chevron-down"
              style="font-size: 0.7rem; color: var(--gray-400)"
            ></i>
            <div class="dropdown-menu">
              <a href="/profile"><i class="fas fa-user"></i> My Profile</a>
              <a href="#"><i class="fas fa-cog"></i> Settings</a>
              <hr />
              <a href="../login" id="logoutBtn"
                ><i class="fas fa-sign-out-alt"></i> Logout</a
              >
            </div>
          </div>
        </div>
      </header>

      <!-- ═══ ANALYTICS CONTENT ═══ -->
      <div class="analytics-content">
        <div class="container">
          <!-- Stats Overview -->
          <div class="stats-overview" id="statsOverview">
            <div class="overview-card">
              <div class="overview-icon blue">
                <i class="fas fa-share-alt"></i>
              </div>
              <div class="overview-info">
                <h4 id="totalLinks">0</h4>
                <p>Total Links</p>
              </div>
            </div>
            <div class="overview-card">
              <div class="overview-icon green"><i class="fas fa-eye"></i></div>
              <div class="overview-info">
                <h4 id="totalViews">0</h4>
                <p>Total Views</p>
              </div>
            </div>
            <div class="overview-card">
              <div class="overview-icon purple">
                <i class="fas fa-lock"></i>
              </div>
              <div class="overview-info">
                <h4 id="protectedLinks">0</h4>
                <p>Protected</p>
              </div>
            </div>
            <div class="overview-card">
              <div class="overview-icon orange"><i class="fas fa-ban"></i></div>
              <div class="overview-info">
                <h4 id="blockedLinks">0</h4>
                <p>Blocked</p>
              </div>
            </div>
          </div>

          <!-- Modern Floating Search Bar -->
          <div class="search-row">
            <div class="search-wrap">
              <i class="fas fa-search search-icon-left"></i>
              <input
                type="text"
                class="search-input"
                id="searchAnalytics"
                placeholder="Search shared recordings..."
              />

              <button
                class="search-clear"
                id="searchClear"
                title="Clear search"
              >
                <i class="fas fa-times"></i>
              </button>
            </div>
          </div>

          <!-- Share Cards List -->
          <div class="share-list" id="shareList">
            <div style="text-align: center; padding: 2rem; color: #94a3b8">
              <i
                class="fas fa-spinner fa-spin"
                style="color: #3b82f6; font-size: 1.5rem"
              ></i>
              <p style="margin-top: 0.5rem">Loading shared links...</p>
            </div>
          </div>

          <!-- Empty State -->
          <div class="empty-state" id="emptyState" style="display: none">
            <i class="fas fa-share-alt"></i>
            <h3>No shared links yet</h3>
            <p>
              Go to Downloads and click "Share" on any recording to create one.
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- Confirm Modal -->
    <div class="modal-overlay" id="confirmModal">
      <div class="modal-card">
        <div class="modal-icon" id="modalIcon" style="background: #ef4444">
          <i class="fas fa-exclamation-triangle"></i>
        </div>
        <h3 id="modalTitle">Confirm Action</h3>
        <p id="modalMessage">Are you sure?</p>
        <div class="modal-actions">
          <button class="modal-btn modal-btn-cancel" onclick="closeModal()">
            Cancel
          </button>
          <button class="modal-btn modal-btn-danger" id="modalConfirmBtn">
            Confirm
          </button>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
      <i class="fas fa-check-circle"></i>
      <span id="toastMsg">Done!</span>
    </div>

    <script src="../js/share-analytics.js"></script>
  </body>
</html>
