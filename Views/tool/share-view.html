<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shared Video | FallStream.io</title>
    <script src="../js/page-loader.js"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/share-view.css" />
  </head>
  <body>
    <div class="viewer-container">
      <div class="video-card">
        <div class="video-wrapper" id="videoContainer">
          <video id="sharedVideo" controls autoplay></video>

          <!-- Loading spinner -->
          <div class="loading-overlay" id="loadingOverlay">
            <i class="fas fa-spinner fa-spin loading-spinner"></i>
            <span class="loading-text">Loading video…</span>
          </div>

          <!-- Fullscreen toggle -->
          <button
            class="fullscreen-btn"
            id="fullscreenBtn"
            title="Fullscreen"
            onclick="toggleFullscreen()"
          >
            <i class="fas fa-expand"></i>
          </button>
        </div>

        <div class="video-info">
          <h2 id="videoTitle">Loading…</h2>
          <p><i class="fas fa-share-alt"></i> Shared via FallStream.io</p>
        </div>
      </div>
    </div>

    <script src="../js/share-view.js"></script>
  </body>
</html>
